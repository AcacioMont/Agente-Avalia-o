name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + testes + smoke da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias (raiz, backend, frontend)
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund

      - name: Configurar ambiente
        run: cp backend/.env.example backend/.env

      - name: Banco de dados (Prisma generate + push + seed)
        run: npm run db:init

      - name: Testes (Vitest)
        run: npm test

      - name: Build (backend tsc + frontend vite)
        run: npm run build

      - name: Smoke test da API
        run: |
          cd backend
          npx tsx src/server.ts &
          SERVER_PID=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/sistema/status > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::A API nao respondeu em 30s no smoke test"
            exit 1
          fi
          echo "Smoke test ok: /api/v1/sistema/status respondeu 200"
